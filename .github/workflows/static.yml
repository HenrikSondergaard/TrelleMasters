name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint, Test & Build ───────────────────────────────────────────────────────
  # Körs vid push till main OCH vid pull requests mot main.
  # Avbryter pipelinen om lint-fel, misslyckade tester eller CSS-byggfel hittas.
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installera beroenden
        run: npm install

      - name: Bygg CSS (Sass)
        run: npm run build

      - name: Lint (ESLint)
        run: npm run lint

      - name: Test (Vitest)
        run: npm test

  # ── Deploy till GitHub Pages ─────────────────────────────────────────────────
  # Körs bara vid lyckad push till main (inte vid pull requests).
  # CSS byggs från css/src/*.scss FÖRE uppladdning. node_modules tas bort så att
  # endast den statiska sajten hamnar i Pages-artefakten.
  # Inga GitHub Secrets krävs — GitHub Pages använder den inbyggda GITHUB_TOKEN.
  deploy:
    name: Deploy till GitHub Pages
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Bygg CSS (Sass)
        run: npm run build

      - name: Ta bort dev-beroenden inför uppladdning
        run: rm -rf node_modules

      - name: Konfigurera Pages
        uses: actions/configure-pages@v4

      - name: Ladda upp artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploya till GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
